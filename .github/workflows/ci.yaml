name: CI Pipeline - Dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  ci-process:
    name: Build, Scan and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. On build l'image LOCALEMENT d'abord pour le scan
      - name: Build local image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Charge l'image dans le Docker local du runner
          tags: intranet-newdeal:test

      # 2. Scan de l'image locale (pas besoin de login ici car elle est sur le runner)
      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'intranet-newdeal:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 3. Si le scan passe, on PUSH sur Docker Hub
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-${{ github.run_number }}

      - name: Final Validation
        run: |
          echo "✅ Image construite, scannée et poussée avec succès !"