name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:

  # ========================
  # JOB 1 : BUILD
  # ========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal .

  # ========================
  # JOB 2 : SCAN SECURITE
  # ========================
  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal
          format: table
          exit-code: 0

      - name: Scan secrets
        run: echo "Scan secrets..."

  # ========================
  # JOB 3 : PUSH DOCKER HUB
  # ========================
  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal
        