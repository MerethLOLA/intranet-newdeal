name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:

  # ========================
  # JOB 1 : BUILD
  # ========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal .

  # ========================
  # JOB 2 : SCAN SECURITE
  # ========================
  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal
          format: table
          exit-code: 0

      - name: Scan secrets
        run: echo "Scan secrets..."

  # ========================
  # JOB 3 : PUSH DOCKER HUB
  # ========================
  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal

        name: CD Pipeline

        on:
          push:
            branches:
              - prod

        jobs:

          # ========================
          # JOB 1 : SCAN SECURITE
          # ========================
          scan:
            runs-on: ubuntu-latest

            steps:
              - name: Scan image (simulation)
                run: echo "Scan sécurité OK"

          # ========================
          # JOB 2 : DEPLOIEMENT
          # ========================
          deploy:
            needs: scan
            runs-on: ubuntu-latest

            steps:
              - name: Pull image depuis Docker Hub
                run: docker pull ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal

              - name: Stop ancien conteneur
                run: docker stop intranet || true

              - name: Supprimer ancien conteneur
                run: docker rm intranet || true

              - name: Lancer nouveau conteneur
                run: |
                  docker run -d -p 80:80 --name intranet \
                  ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal