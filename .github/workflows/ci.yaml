name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  security-events: write
  packages: write

jobs:

  # ========================
  # JOB 1: BUILD & PUSH
  # ========================
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-${{ github.run_number }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:buildcache,mode=max

      - name: Set image output
        id: image
        run: echo "name=${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest" >> $GITHUB_OUTPUT

  # ========================
  # JOB 2: SCAN SECURITE
  # ========================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push # ✅ Corrigé (référence au bon nom de job)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          # ✅ Utilise l'image qui vient d'être poussée
          image-ref: ${{ needs.build-and-push.outputs.image }}
          format: table
          exit-code: 0

      - name: Scan secrets
        run: echo "Scan secrets OK"

  # ========================
  # JOB 3: VALIDATION
  # ========================
  validate:
    name: Validate Image
    runs-on: ubuntu-latest
    needs: scan # ✅ Corrigé (doit attendre le scan)

    steps:
      - name: Pull image from Docker Hub
        run: docker pull ${{ needs.build-and-push.outputs.image }}

      - name: Verify image exists
        run: |
          docker images | grep intranet-newdeal
          echo "✅ Image successfully validated"