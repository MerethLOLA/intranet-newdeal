name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ========================
  # JOB 1: SCAN SECURITE
  # ========================
  security-scan:
    name: Security Scan - Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ CORRECTION: Utiliser Trivy réellement au lieu d'une simulation
      - name: Run Trivy scan on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        if: always()
        with:

      # ✅ CORRECTION: Scan réel des secrets
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security checks passed
        run: echo "✅ All security checks passed"


  # ========================
  # JOB 2: DEPLOIEMENT
  # ========================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-scan  # ✅ CORRECTION: Ajouter "needs" pour attendre le scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ CORRECTION: Vérifier que l'image existe
      - name: Pull image from Docker Hub
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
          echo "✅ Image pulled successfully"

      # ✅ CORRECTION: Arrêter l'ancien container correctement
      - name: Stop existing container
        run: |
          docker stop intranet-newdeal || echo "No running container"
          docker rm intranet-newdeal || echo "No container to remove"
          echo "✅ Old container stopped"

      # ✅ CORRECTION: Lancer le container avec restart policy
      - name: Deploy new container on port 80
        run: |
          docker run -d \
            --name intranet-newdeal \
            --restart unless-stopped \
            -p 80:80 \
            -e BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -e BUILD_VERSION="${{ github.sha }}" \
            ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
          echo "✅ Container deployed"

      # ✅ CORRECTION: Vérifier que le container fonctionne
      - name: Verify container is running
        run: |
          docker ps | grep intranet-newdeal
          echo "✅ Container is running"

      # ✅ CORRECTION: NOUVEAU - Health check du site
      - name: Health check - Website accessibility
        run: |
          echo "Checking if website is accessible..."
          for i in {1..15}; do
            echo "Attempt $i/15..."
            if curl -f -s -o /dev/null -w "%{http_code}" http://localhost/ | grep -q "200"; then
              echo "✅ Website is accessible (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Website not accessible"
          docker logs intranet-newdeal
          exit 1

      # ✅ CORRECTION: Vérifier que le contenu s'affiche
      - name: Test website content
        run: |
          echo "Testing website content..."
          curl -s http://localhost/ | head -30
          echo ""
          echo "✅ Website content accessible"

      - name: Deployment summary
        run: |
          echo "╔════════════════════════════════════╗"
          echo "║   DEPLOYMENT SUCCESSFUL            ║"
          echo "╚════════════════════════════════════╝"
          echo ""
          echo "✅ Service: Intranet NewDeal"
          echo "✅ Environment: Production"
          echo "✅ Port: 80"
          echo "✅ Status: LIVE"
          echo ""
          echo "Container: intranet-newdeal"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"


  # ========================
  # JOB 3: NOTIFICATIONS
  # ========================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [security-scan, deploy]
    if: always()

    steps:
      - name: Prepare notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=✅ SUCCESS" >> $GITHUB_ENV
            echo "emoji=🎉" >> $GITHUB_ENV
          else
            echo "status=❌ FAILED" >> $GITHUB_ENV
            echo "emoji=⚠️" >> $GITHUB_ENV
          fi

      - name: Log deployment result
        run: |
          echo "${{ env.emoji }} Deployment Status: ${{ env.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      # ✅ OPTIONNEL: Envoyer un email
      # Décommenter et configurer les secrets EMAIL_*
      # - name: Send email notification
      #   uses: dawidd6/action-send-mail@v3
      #   if: always()
      #   with:
      #     server_address: ${{ secrets.EMAIL_SERVER }}
      #     server_port: ${{ secrets.EMAIL_PORT }}
      #     username: ${{ secrets.EMAIL_USERNAME }}
      #     password: ${{ secrets.EMAIL_PASSWORD }}
      #     subject: "Deployment ${{ env.status }} - Intranet NewDeal"
      #     to: "moussawade@groupeisi.com"
      #     body: |
      #       Deployment completed: ${{ env.status }}
      #       Branch: ${{ github.ref_name }}
      #       Commit: ${{ github.sha }}

      - name: Notification completed
        run: echo "✅ Notifications sent"
